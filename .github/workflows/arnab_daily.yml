name: Water context — daily

# Every morning: reads the State's water context (about thirty requests to the public
# APWRIMS dashboards), commits it and redeploys, so soil moisture, gauge rain, reservoirs
# and canal outlets are current across the site through the rabi season. It began as the
# Cyclone Arnab job; kept daily past the cyclones on 25 November 2026, at the user's call.
#
# Until 30 November it also adds the day to the cyclones' logs (Arnab, Murasu, Akvan) and
# the Himawari loop; after that the weekly refresh keeps the cyclone page, which runs the
# same builders. What the weekly refresh builds from the water context (drought watch,
# constituencies, field signals, summer outlook) still moves weekly, each with its own date.
#
# 03:30 UTC is 09:00 IST, after the portal's morning reservoir readings. On a Monday
# the weekly refresh may push while this runs, so the push rebases first.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

# Shared with the weekly refresh's job: both commit the water context, and the weekly
# job pushes without rebasing, so the two never run at once. Whichever starts second
# checks out after the first has pushed.
concurrency:
  group: apwrims-water-data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: The cyclone steps stop after 30 November
        id: window
        # The water context runs every day; only the cyclones' own steps have an end date.
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          if [ "$(date -u +%Y%m%d)" -gt 20261130 ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Past 30 November: the water context only; the weekly refresh keeps the cyclone page."
            echo "cyclones=false" >> "$GITHUB_OUTPUT"
          else
            echo "cyclones=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: "3.11"
      - name: Install dependencies
        if: steps.window.outputs.run == 'true'
        # The same libraries as the weekly job: the context fetcher borrows its boundary matching
        # from build_levels_engine.py, which imports joblib and scikit-learn.
        run: pip install -r requirements.txt scikit-learn joblib pandas numpy pytest
      - name: Read the water context
        if: steps.window.outputs.run == 'true'
        run: python phase3_levels/fetch_apwrims_context.py
      - name: Add the day to Arnab's log
        if: steps.window.outputs.cyclones == 'true'
        run: python phase3_levels/build_cyclone_arnab.py
      - name: Count the third cyclone
        if: steps.window.outputs.cyclones == 'true'
        run: python phase3_levels/build_cyclone_akvan.py
      - name: Draw the last 48 hours from Himawari
        # ffmpeg encodes the loop; a bad night at GIBS keeps the last loop (the step does not fail the day).
        if: steps.window.outputs.cyclones == 'true'
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python phase3_levels/build_live_clouds.py || echo "live loop not rebuilt"
      - name: Check the pages still say what they are allowed to say
        if: steps.window.outputs.run == 'true'
        run: |
          if [ "${{ steps.window.outputs.cyclones }}" = "true" ]; then
            python -m pytest -q tests/test_cyclone_arnab.py tests/test_water_context.py tests/test_cyclone_akvan.py
          else
            python -m pytest -q tests/test_water_context.py
          fi
      - name: Commit the day
        if: steps.window.outputs.run == 'true'
        id: publish
        run: |
          git config user.name "phase3-bot"
          git config user.email "bot@local"
          git add app/data/cyclone_arnab.json phase3_levels/data/cyclone_arnab_daily.json phase3_levels/data/cyclone_murasu_rain.json app/data/cyclone_akvan.json app/data/live_clouds.json app/public/cyclones/live.mp4 app/public/cyclones/live-poster.jpg
          git add app/data/water_context.json app/data/water_context_summary.json app/data/water_context_mandals.json data/refresh_receipts/apwrims_context.json
          if git diff --cached --quiet; then
            echo "nothing new today"
            exit 0
          fi
          git commit -m "chore(water): daily water context $(date -u +%Y-%m-%d)"
          git stash --include-untracked || true
          git pull --rebase origin main
          # main may have moved while this ran (a merged pull request, another bot): replay this
          # commit on top of it, keeping this run's own data where both touched a file, and retry.
          for attempt in 1 2 3; do
            git push && break
            [ "$attempt" = 3 ] && exit 1
            git pull --rebase --autostash -X theirs origin main || { git rebase --abort; exit 1; }
          done
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Deploy
        # A push made with this workflow's own token starts no other workflow; a dispatch does.
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
