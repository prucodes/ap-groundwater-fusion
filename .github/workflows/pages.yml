name: Deploy to GitHub Pages

# Builds the static export and publishes it to Pages. The built site is never
# committed — it is uploaded straight to Pages as an artifact, so the repository
# keeps only source.
on:
  push:
    branches: [main]
  # Pull requests run the checks and the browser suite before merge; they never deploy.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Allow one concurrent deployment; let an in-progress run finish so a live
# deploy is never left half-published.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the V2 data contract
        # The weekly refresh runs this same check before it publishes. Running it
        # on every push means a change that would block the Monday refresh fails
        # here, at push time, instead of silently freezing the live data.
        run: python3 phase3_levels/validate_phase0.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Type-check
        working-directory: app
        run: npm run typecheck
      - name: Build static export
        working-directory: app
        # basePath must match the repository name so assets resolve under
        # https://<user>.github.io/<repo>/. Override PAGES_BASE_PATH (to "")
        # if this ever moves to a custom domain or a user/org site.
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:static
      - name: Print the weekly digest to PDF
        # /digest/ printed to out/digest/ap-water-weekly-digest.pdf, so the page's
        # "Download PDF" serves this build's sheet. A failure here never blocks
        # the site: the page itself still prints from the browser.
        working-directory: app
        continue-on-error: true
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npx playwright install --with-deps chromium
          node scripts/print-digest.mjs --directory out --base "$PAGES_BASE_PATH"
      - name: Print the project brief to PDF
        # /brief/ printed to out/brief/ap-water-intelligence-brief.pdf with this
        # week's maps, 3D renders and site screenshots, linked from Methodology.
        # A failure never blocks the site.
        working-directory: app
        continue-on-error: true
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: node scripts/print-brief.mjs --directory out --base "$PAGES_BASE_PATH"
      - name: Disable Jekyll processing
        # Without this, Pages' Jekyll step ignores files/dirs beginning with "_",
        # which would drop Next's _next/ asset directory and break every page.
        run: touch app/out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/out

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  browser-tests:
    # The full browser suite against this commit, built at the root as the tests
    # expect. It reports and never holds back the deploy: a test that new data
    # breaks shows a red cross on this run the same day, not a week later.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Build static export at the root
        working-directory: app
        env:
          PAGES_BASE_PATH: ""
        run: npm run build:static
      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Run the browser suite
        working-directory: app
        env:
          CI: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3217
        run: |
          node scripts/serve-static.mjs --port 3217 --bind 127.0.0.1 --directory out &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:3217/ >/dev/null && break; sleep 0.2; done
          npx playwright test --retries=1
