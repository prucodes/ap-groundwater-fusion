name: Deploy to GitHub Pages

# Builds the static export and publishes it to Pages. The built site is never
# committed — it is uploaded straight to Pages as an artifact, so the repository
# keeps only source.
on:
  push:
    branches: [main]
  # Pull requests run the checks and the browser suite before merge; they never deploy.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Allow one concurrent deployment; let an in-progress run finish so a live
# deploy is never left half-published.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  # A new push to a pull request makes its older run moot, so stop it rather than queue
  # behind it. Deploys from main never cancel: a live deploy always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the V2 data contract
        # The weekly refresh runs this same check before it publishes. Running it
        # on every push means a change that would block the Monday refresh fails
        # here, at push time, instead of silently freezing the live data.
        run: python3 phase3_levels/validate_phase0.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Type-check
        working-directory: app
        run: npm run typecheck
      - name: Build static export
        working-directory: app
        # basePath must match the repository name so assets resolve under
        # https://<user>.github.io/<repo>/. Override PAGES_BASE_PATH (to "")
        # if this ever moves to a custom domain or a user/org site.
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:static
      - name: Print the weekly digest to PDF
        # /digest/ printed to out/digest/ap-water-weekly-digest.pdf, so the page's
        # "Download PDF" serves this build's sheet. A failure here never blocks
        # the site: the page itself still prints from the browser.
        working-directory: app
        continue-on-error: true
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npx playwright install --with-deps chromium
          node scripts/print-digest.mjs --directory out --base "$PAGES_BASE_PATH"
      - name: Print the summer brief to PDF
        # /summer/brief/ printed to out/summer/brief/ap-summer-water-brief.pdf, one A4
        # sheet for officials planning summer drinking water. Never blocks the site.
        working-directory: app
        continue-on-error: true
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: node scripts/print-digest.mjs --directory out --base "$PAGES_BASE_PATH" --route summer/brief --file ap-summer-water-brief.pdf
      - name: Print the field check protocol to PDF
        # /field-check/sheet/ printed to out/field-check/sheet/ap-field-check-protocol.pdf,
        # the one page for the Groundwater Department. Never blocks the site.
        working-directory: app
        continue-on-error: true
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: node scripts/print-digest.mjs --directory out --base "$PAGES_BASE_PATH" --route field-check/sheet --file ap-field-check-protocol.pdf
      - name: Print the project brief to PDF
        # /brief/ printed to out/brief/ap-water-intelligence-brief.pdf with this
        # week's maps, 3D renders and site screenshots, linked from Methodology.
        # A failure never blocks the site.
        working-directory: app
        continue-on-error: true
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: node scripts/print-brief.mjs --directory out --base "$PAGES_BASE_PATH"
      - name: Restore the weekly film if nothing it shows has changed
        # /weekly-film/ recorded to MP4 in three shapes takes a few minutes, so a deploy that
        # changes neither the data nor the film's own code reuses the last recording.
        uses: actions/cache@v4
        with:
          path: app/.weekly-film
          key: weekly-film-${{ hashFiles('app/data/**', 'app/lib/**', 'app/components/film/**', 'app/app/weekly-film/**', 'app/app/fonts/**', 'app/scripts/render-film.mjs') }}
      - name: Record the weekly film
        # out/films/weekly/*.mp4 and manifest.json, which the page's download row reads. Every
        # scene is checked for overlapping or clipped text before anything is encoded. On main a
        # failure never blocks the site: the page still plays the film live, without downloads.
        # On a pull request it fails the build, so a change that breaks the film is seen there.
        working-directory: app
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          if [ ! -f .weekly-film/manifest.json ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
            npx playwright install --with-deps chromium
            node scripts/render-film.mjs --film weekly --directory out --base "$PAGES_BASE_PATH" --output .weekly-film
          fi
          mkdir -p out/films/weekly && cp .weekly-film/* out/films/weekly/
      - name: Restore the method film if nothing it shows has changed
        # The Methodology page's film quotes the model card, the season's recharge and the gauge
        # network, all of which change at most weekly, so most deploys reuse the last recording.
        uses: actions/cache@v4
        with:
          path: app/.method-film
          key: method-film-${{ hashFiles('app/data/model_card.json', 'app/data/monsoon_watch.json', 'app/data/water_context.json', 'app/lib/**', 'app/components/film/**', 'app/app/fonts/**', 'app/scripts/render-film.mjs') }}
      - name: Record the method film
        # out/films/methodology/*.mp4 and manifest.json, checked and published as the weekly film is.
        working-directory: app
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          if [ ! -f .method-film/manifest.json ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
            npx playwright install --with-deps chromium
            node scripts/render-film.mjs --film methodology --directory out --base "$PAGES_BASE_PATH" --output .method-film
          fi
          mkdir -p out/films/methodology && cp .method-film/* out/films/methodology/
      - name: Restore the garden film if nothing it shows has changed
        # The Water Garden film draws the monthly well readings, which change once a month, so
        # most deploys reuse the last recording.
        uses: actions/cache@v4
        with:
          path: app/.garden-film
          key: garden-film-${{ hashFiles('app/data/mandal_observation_series_v2.json', 'app/data/mandal_groundwater_records_v2.json', 'app/lib/gardenShared.ts', 'app/lib/waterGarden.ts', 'app/lib/creator.ts', 'app/components/garden/**', 'app/components/film/FilmPlayer.tsx', 'app/components/film/FilmPlayer.module.css', 'app/app/fonts/**', 'app/scripts/render-film.mjs') }}
      - name: Record the garden film
        # out/films/garden/*.mp4 and manifest.json, checked and published as the weekly film is.
        working-directory: app
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          if [ ! -f .garden-film/manifest.json ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
            npx playwright install --with-deps chromium
            node scripts/render-film.mjs --film garden --directory out --base "$PAGES_BASE_PATH" --output .garden-film
          fi
          mkdir -p out/films/garden && cp .garden-film/* out/films/garden/
      - name: Keep the films' contact sheets
        # The frames each film was judged on, one sheet per shape, for a person to look at.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-contact-sheets
          path: app/test-results/*-film/*.j*
          if-no-files-found: ignore
          retention-days: 14
      - name: Disable Jekyll processing
        # Without this, Pages' Jekyll step ignores files/dirs beginning with "_",
        # which would drop Next's _next/ asset directory and break every page.
        run: touch app/out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/out

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  python-tests:
    # The integrity suite the weekly refresh runs before it publishes. Run here too, so a change
    # that would stop Monday's refresh shows on its own pull request, not on Monday.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt scikit-learn joblib pandas numpy rasterio xarray netCDF4
      - name: Run the Python integrity suite
        run: python -m pytest -q

  browser-tests:
    # The full browser suite against this commit, built at the root as the tests
    # expect. It reports and never holds back the deploy: a test that new data
    # breaks shows a red cross on this run the same day, not a week later.
    # Split four ways across parallel runners: about a quarter of the wait.
    name: browser-tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Build static export at the root
        working-directory: app
        env:
          PAGES_BASE_PATH: ""
        run: npm run build:static
      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Run the browser suite
        working-directory: app
        env:
          CI: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3217
        run: |
          node scripts/serve-static.mjs --port 3217 --bind 127.0.0.1 --directory out &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:3217/ >/dev/null && break; sleep 0.2; done
          npx playwright test --retries=1 --shard=${{ matrix.shard }}/4
