name: Phase 3 — weekly groundwater levels

# Hands-off: pulls APWRIMS sensor readings, NASA GRACE-DA, CHIRPS, TerraClimate
# and NASA POWER rainfall every Monday, plus APWRIMS soil moisture, gauge
# rainfall and reservoir storage for the Agriculture page,
# rebuilds features, and re-predicts mandal levels. No manual feeding.
on:
  schedule:
    - cron: "0 2 * * 1"        # 02:00 UTC every Monday
  workflow_dispatch: {}         # allow manual trigger from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Python dependencies
        run: pip install -r requirements.txt scikit-learn joblib pandas numpy rasterio xarray netCDF4
      - name: Install application dependencies
        working-directory: app
        run: npm ci
      # If GLDAS / GRACE mascons need NASA Earthdata auth, add a ~/.netrc step here
      # using EARTHDATA_USER / EARTHDATA_PASS secrets before the run.
      - name: Run weekly pipeline
        # IMD stays dormant until these exist: IMD_API_KEY as a repository
        # secret, IMD_AUTH (how the key travels) and IMD_PUBLISH as variables.
        env:
          IMD_API_KEY: ${{ secrets.IMD_API_KEY }}
          IMD_AUTH: ${{ vars.IMD_AUTH }}
          IMD_PUBLISH: ${{ vars.IMD_PUBLISH }}
        run: python phase3_levels/fetch_weekly.py
      - name: Run Python integrity suite
        run: python -m pytest -q
      - name: Revalidate generated V2 artifacts
        run: python phase3_levels/validate_phase0.py
      - name: Type-check application
        working-directory: app
        run: npm run typecheck
      - name: Build production application
        working-directory: app
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:static
      - name: Commit refreshed outputs
        run: |
          git config user.name "phase3-bot"
          git config user.email "bot@local"
          # Commit only canonical V2 outputs and refreshed source-context assets.
          # Legacy V1 artifacts are deliberately excluded.
          git add \
            phase3_levels/outputs/mandal_nowcasts_v2.json \
            phase3_levels/outputs/mandal_forecast_3m.json \
            phase3_levels/outputs/phase0_evaluations.json \
            phase3_levels/outputs/weekly_run_log.json \
            phase3_levels/data \
            phase3_levels/apwrims/apwrims_gw_history.csv \
            app/data/mandal_groundwater_records_v2.json \
            app/data/mandal_observation_series_v2.json \
            app/data/model_card.json \
            app/data/dataset_manifest.json \
            app/data/ap_district_geometry.json \
            app/data/ap_mandal_heat.json \
            app/data/monsoon_watch.json \
            app/data/water_context.json \
            app/data/water_context_summary.json \
            app/data/water_context_mandals.json \
            app/data/drought_watch.json \
            app/data/drought_watch_summary.json \
            app/data/field_signals.json \
            app/data/field_signals_mandals.json \
            app/data/crop_water_scorecard.json \
            app/data/summer_outlook.json \
            app/data/drinking_water.json \
            app/data/tank_fill.json \
            phase3_levels/data/tank_fill_years.json \
            app/data/enso_outlook.json \
            app/data/constituencies.json \
            app/data/weekly_changes.json \
            app/data/forecast_reliability.json \
            app/data/nasa_provenance.json \
            app/data/satellite_station_samples.json \
            app/public/water-crystal-3d.html \
            reports/watch-source-audit.json
          if [ -d data/refresh_receipts ]; then
            git add data/refresh_receipts
          fi
          git commit -m "chore(phase3): weekly levels refresh" || echo "no changes"
          git push

      - name: Print the weekly digest to PDF
        # This Monday's one-page digest, beside the page that shows it. Never blocks the publish.
        working-directory: app
        continue-on-error: true
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npx playwright install --with-deps chromium
          node scripts/print-digest.mjs --directory out --base "$PAGES_BASE_PATH"
      - name: Print the project brief to PDF
        # /brief/ printed to out/brief/ap-water-intelligence-brief.pdf with this
        # week's maps, 3D renders and site screenshots, linked from Methodology.
        # A failure never blocks the site.
        working-directory: app
        continue-on-error: true
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: node scripts/print-brief.mjs --directory out --base "$PAGES_BASE_PATH"
      - name: Disable Jekyll processing
        run: touch app/out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/out

      - name: Trigger redeploy
        # Host-agnostic deploy hook (Vercel/Netlify/Render all support these).
        # Add the URL as repo secret DEPLOY_HOOK_URL; step is a no-op if unset.
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            echo "Triggering redeploy…"
            curl -fsS -X POST "$DEPLOY_HOOK_URL" && echo "deploy triggered"
          else
            echo "DEPLOY_HOOK_URL not set — skipping (commit alone will deploy if host auto-builds on push)."
          fi

      # A Monday that published but kept some feeds from last week (an optional
      # step failed, or the portal looked mid-revision) says so in an issue.
      - name: Report feeds that kept last week's data
        continue-on-error: true   # the report must never fail a refresh that published
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report=$(python3 phase3_levels/refresh_health.py)
          if [ -z "$report" ]; then
            echo "every feed refreshed"
            exit 0
          fi
          echo "$report"
          title="Weekly refresh kept some of last week's data"
          body=$(printf '%s\n\n%s\n\nRun: %s' "The weekly refresh published on $(date -u +%Y-%m-%d), but these did not refresh:" "$report" "$RUN_URL")
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      # A failed Monday used to be silent: the site kept last week's data and
      # said nothing. Open (or add to) one issue so a person hears about it.
      - name: Raise an issue when the refresh fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly refresh failed"
          body="The weekly refresh failed on $(date -u +%Y-%m-%d). The site still shows the previous week's data. Run: $RUN_URL"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  deploy:
    needs: weekly
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  browser-tests:
    # The full browser suite against this commit, built at the root as the tests
    # expect. It reports and never holds back the deploy: a test that new data
    # breaks shows a red cross on this run the same day, not a week later.
    runs-on: ubuntu-latest
    needs: weekly
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the refresh just pushed, with this week's data.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Build static export at the root
        working-directory: app
        env:
          PAGES_BASE_PATH: ""
        run: npm run build:static
      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Run the browser suite
        working-directory: app
        env:
          CI: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3217
        run: |
          node scripts/serve-static.mjs --port 3217 --bind 127.0.0.1 --directory out &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:3217/ >/dev/null && break; sleep 0.2; done
          npx playwright test --retries=1
