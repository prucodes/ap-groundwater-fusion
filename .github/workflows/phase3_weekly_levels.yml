name: Phase 3 — weekly groundwater levels

# Hands-off: pulls latest GRACE-DA + CHIRPS + TerraClimate every Monday,
# rebuilds features, and re-predicts mandal levels. No manual feeding.
on:
  schedule:
    - cron: "0 2 * * 1"        # 02:00 UTC every Monday
  workflow_dispatch: {}         # allow manual trigger from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Python dependencies
        run: pip install -r requirements.txt scikit-learn joblib pandas numpy rasterio xarray netCDF4
      - name: Install application dependencies
        working-directory: app
        run: npm ci
      # If GLDAS / GRACE mascons need NASA Earthdata auth, add a ~/.netrc step here
      # using EARTHDATA_USER / EARTHDATA_PASS secrets before the run.
      - name: Run weekly pipeline
        run: python phase3_levels/fetch_weekly.py
      - name: Run Python integrity suite
        run: python -m pytest -q
      - name: Revalidate generated V2 artifacts
        run: python phase3_levels/validate_phase0.py
      - name: Type-check application
        working-directory: app
        run: npm run typecheck
      - name: Build production application
        working-directory: app
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:static
      - name: Commit refreshed outputs
        run: |
          git config user.name "phase3-bot"
          git config user.email "bot@local"
          # Commit only canonical V2 outputs and refreshed source-context assets.
          # Legacy V1 artifacts are deliberately excluded.
          git add \
            phase3_levels/outputs/mandal_nowcasts_v2.json \
            phase3_levels/outputs/phase0_evaluations.json \
            phase3_levels/outputs/weekly_run_log.json \
            phase3_levels/data \
            phase3_levels/apwrims/apwrims_gw_history.csv \
            app/data/mandal_groundwater_records_v2.json \
            app/data/mandal_observation_series_v2.json \
            app/data/model_card.json \
            app/data/dataset_manifest.json \
            app/data/ap_district_geometry.json \
            app/data/ap_mandal_heat.json \
            app/data/nasa_provenance.json \
            app/data/satellite_station_samples.json
          git commit -m "chore(phase3): weekly levels refresh" || echo "no changes"
          git push

      - name: Disable Jekyll processing
        run: touch app/out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/out

      - name: Trigger redeploy
        # Host-agnostic deploy hook (Vercel/Netlify/Render all support these).
        # Add the URL as repo secret DEPLOY_HOOK_URL; step is a no-op if unset.
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            echo "Triggering redeploy…"
            curl -fsS -X POST "$DEPLOY_HOOK_URL" && echo "deploy triggered"
          else
            echo "DEPLOY_HOOK_URL not set — skipping (commit alone will deploy if host auto-builds on push)."
          fi

  deploy:
    needs: weekly
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
