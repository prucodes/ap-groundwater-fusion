name: Groundwater sensors — daily

# Every evening: one request to the APWRIMS telemetry service for every automatic
# water-level recorder's latest reading (the request its public groundwater dashboard
# makes), reduced to app/data/gw_sensors.json and a point on the State's daily line.
# The weekly refresh runs the same step.
#
# 13:00 UTC is 18:30 IST: the day's readings are in. The weekly refresh pushes without
# rebasing, so the two share its concurrency group and this one rebases before pushing.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: apwrims-water-data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Read the sensors
        run: python phase3_levels/fetch_apwrims_sensors.py
      - name: Count the third cyclone's sensors
        # Each sensor against its own reading before the storm; the rain half moves with the morning job.
        run: python phase3_levels/build_cyclone_akvan.py
      - name: Draw the last 48 hours from Himawari
        continue-on-error: true
        # ffmpeg encodes the loop; a bad night at GIBS keeps the last loop (the step does not fail the day).
        run: |
          # Refresh the package list first: a stale one 404s on Ubuntu's mirror (25 Nov 2026), and with
          # bash -e that failed the whole day before the data was committed. Nothing here may stop the day.
          (sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq ffmpeg > /dev/null) || echo "ffmpeg not installed"
          python phase3_levels/build_live_clouds.py || echo "live loop not rebuilt"
      - name: Check what the page may say
        run: python -m pytest -q tests/test_sensors.py tests/test_cyclone_akvan.py
      - name: Commit the day
        id: publish
        run: |
          git config user.name "phase3-bot"
          git config user.email "bot@local"
          git add app/data/gw_sensors.json app/data/gw_sensors_history.json app/data/gw_sensors_state.json app/data/cyclone_akvan.json app/data/live_clouds.json app/public/cyclones/live.mp4 app/public/cyclones/live-poster.jpg
          if git diff --cached --quiet; then
            echo "nothing new today"
            exit 0
          fi
          git commit -m "chore(sensors): daily groundwater sensors $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          # main may have moved while this ran (a merged pull request, another bot): replay this
          # commit on top of it, keeping this run's own data where both touched a file, and retry.
          for attempt in 1 2 3; do
            git push && break
            [ "$attempt" = 3 ] && exit 1
            git pull --rebase --autostash -X theirs origin main || { git rebase --abort; exit 1; }
          done
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Deploy
        # A push made with this workflow's own token starts no other workflow; a dispatch does.
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
