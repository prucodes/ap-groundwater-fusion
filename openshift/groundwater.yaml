# AI Living Labs — Groundwater dashboard (Track-4 hosted app).
# Static-data Next.js app; no database. Namespace: living-labs-groundwater.
# Deploy: see openshift/README.md
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: groundwater
  namespace: living-labs-groundwater
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: groundwater
  namespace: living-labs-groundwater
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: groundwater:latest
  resources:
    requests: { cpu: "1", memory: "2Gi" }
    limits: { cpu: "4", memory: "6Gi" }   # Next 16 build headroom (many workers)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: groundwater
  namespace: living-labs-groundwater
  labels: { app: groundwater }
  annotations:
    image.openshift.io/triggers: |
      [{"from":{"kind":"ImageStreamTag","name":"groundwater:latest"},"fieldPath":"spec.template.spec.containers[0].image"}]
spec:
  replicas: 1
  selector: { matchLabels: { app: groundwater } }
  template:
    metadata: { labels: { app: groundwater } }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: groundwater
          image: image-registry.openshift-image-registry.svc:5000/living-labs-groundwater/groundwater:latest
          ports: [{ containerPort: 3000 }]
          # ANTHROPIC_API_KEY is optional — the AI-brief feature disables itself
          # without it; the rest of the dashboard works. Wire the gateway later.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 12
            periodSeconds: 12
          livenessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: "150m", memory: "384Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: groundwater
  namespace: living-labs-groundwater
spec:
  selector: { app: groundwater }
  ports: [{ name: http, port: 80, targetPort: 3000 }]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: groundwater
  namespace: living-labs-groundwater
spec:
  host: groundwater.apps.sovereign-ai-stack-cl02.ocp.speedcloud.co.in
  to: { kind: Service, name: groundwater }
  port: { targetPort: http }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
